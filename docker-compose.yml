version: "3.8"

services:
  # Synthetic Energy Enrichment API
  synthetic_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - energy-network

  # Dagster Orchestration
  dagster_app:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SYNTHETIC_API_URL=http://synthetic_api:8000
      - EIA_API_KEY=${EIA_API_KEY}
      - DAGSTER_HOME=/app/dagster_home
    depends_on:
      synthetic_api:
        condition: service_healthy
    networks:
      - energy-network

networks:
  energy-network:
    driver: bridge